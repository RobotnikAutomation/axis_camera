version: '3.8'
services:
  workspace:
    image: docker.io/robotnik/ros:jazzy-builder-0.6.2
    tty: true
    stdin_open: true
    volumes:
      - type: bind
        source: ../
        target: /home/robot/robot_ws/src/workspace/
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    command: sleep infinity
    network_mode: host
    privileged: true